name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        id: package
        run: |
          zip="PomoTide-${GITHUB_REF_NAME#v}.zip"
          ditto -c -k --keepParent build/PomoTide.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "PomoTide ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "SHA-256: \`${{ steps.package.outputs.sha256 }}\`"
