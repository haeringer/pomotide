name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: ./test.sh

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        id: package
        run: |
          zip="PomoTide-${GITHUB_REF_NAME#v}.zip"
          ditto -c -k --keepParent build/PomoTide.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "PomoTide ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "SHA-256: \`${{ steps.package.outputs.sha256 }}\`"

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, skipping the cask update"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/haeringer/homebrew-pomotide.git" tap
          cd tap
          cask=Casks/pomotide.rb
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" \
            "$cask"
          grep -qx "  version \"${version}\"" "$cask"
          grep -qx "  sha256 \"${SHA256}\"" "$cask"
          if git diff --quiet; then
            echo "Cask is already at ${version}"
            exit 0
          fi
          git -c user.name="Benjamin Häringer" \
              -c user.email="1086336+haeringer@users.noreply.github.com" \
              commit -qam "Update PomoTide to ${version}"
          git push origin HEAD:main
